<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Rates Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- TradingView ticker tape for highly accurate live rates -->
        <div id="tv-ticker" style="margin: 12px 0;"></div>

        <header>
            <h1>💹 Trading Rates Viewer</h1>
            <p class="subtitle">Real-time Exchange Rates, Commodities & Companies</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search trading pairs...">
            </div>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="forex">Forex</button>
                <button class="filter-btn" data-filter="crypto">Crypto</button>
                <button class="filter-btn" data-filter="commodity">Commodity</button>
                <button class="filter-btn" data-filter="stock">Stock</button>
            </div>
            <button class="watchlist-btn" id="watchlistBtn">⭐ Watchlist</button>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Total Pairs</div>
                <div class="stat-value" id="totalPairs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Watchlist Items</div>
                <div class="stat-value" id="watchlistCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Updated</div>
                <div class="stat-value" id="lastUpdate">--:--:--</div>
            </div>
        </div>

        <div class="rates-grid" id="ratesGrid">
            <!-- Rate cards will be generated here -->
        </div>

        <div class="modal" id="watchlistModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>My Watchlist</h2>
                    <button class="close-btn" id="closeWatchlist">&times;</button>
                </div>
                <div class="modal-body" id="watchlistContent">
                    <!-- Watchlist items will appear here -->
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay"></div>
    </div>

    <script src="app.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Initialize a TradingView Ticker Tape widget for accurate live tickers
        new TradingView.MediumWidget({
            "symbols": [
                { "proName": "OANDA:XAUUSD", "title": "Gold (XAUUSD)" },
                { "proName": "OANDA:XAGUSD", "title": "Silver (XAGUSD)" },
                { "proName": "NYMEX:CL1!", "title": "Crude Oil (CL)" },
                { "proName": "NYMEX:NG1!", "title": "Nat Gas (NG)" },
                { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
                { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
                { "proName": "BINANCE:ETHUSDT", "title": "ETH/USDT" }
            ],
            "chartOnly": false,
            "width": "100%",
            "height": 36,
            "locale": "en",
            "colorTheme": "light",
            "isTransparent": false,
            "autosize": true,
            "container_id": "tv-ticker"
        });
    </script>

    <!-- Live rates WS client (updates tradingPairs in app.js) -->
    <script src="app.live.ws.js"></script>
</body>
</html>
